name: Build APK

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - name: Tests
        run: ./gradlew testDebugUnitTest
      - name: Release keystore from secrets
        env:
          KEYSTORE_B64: ${{ secrets.DABBULU_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "DABBULU_KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
          else
            echo "::warning::No signing secrets set; building an unsigned release APK."
          fi
      - name: Build release APK
        env:
          DABBULU_KEYSTORE_PASSWORD: ${{ secrets.DABBULU_KEYSTORE_PASSWORD }}
          DABBULU_KEY_ALIAS: ${{ secrets.DABBULU_KEY_ALIAS }}
          DABBULU_KEY_PASSWORD: ${{ secrets.DABBULU_KEY_PASSWORD }}
        run: ./gradlew assembleRelease
      - uses: actions/upload-artifact@v4
        with:
          name: dabbulu-apk
          path: app/build/outputs/apk/release/*.apk
